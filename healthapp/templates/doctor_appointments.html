<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&family=Public+Sans%3Awght%40400%3B500%3B700%3B900"
    />
    <title>Rendez-vous</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-gray-100 min-h-screen" style="padding-top: 80px;">
    <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#e7eef3] px-4 py-3 sm:px-10" style="position: fixed; top: 0; left: 0; right: 0; z-index: 10;">
      <div class="flex items-center gap-4 sm:gap-8">
        <div class="flex items-center gap-2 sm:gap-4 text-[#0e161b]">
          <div class="size-4">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z"
                fill="currentColor"
              ></path>
            </svg>
          </div>
          <h2 class="text-[#0e161b] text-lg font-bold leading-tight tracking-[-0.015em]">HealthHub</h2>
        </div>
        <div class="hidden sm:flex items-center gap-4 sm:gap-9">
          <a class="text-[#0e161b] text-sm font-medium leading-normal" href="{% url 'search_medicament' %}">Accueil</a>
          <a class="text-[#0e161b] text-sm font-medium leading-normal" href="{% url 'list_prescriptions' %}">Ordonnances</a>
          <a class="text-[#0e161b] text-sm font-medium leading-normal" href="{% url 'doctor_appointments' %}">Rendez-vous</a>
        </div>
      </div>

      <form method="post" action="{% url 'logout' %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="text-[#0e161b] text-sm font-medium leading-normal hover:text-[#4e7a97]">Logout</button>
      </form>
    </header>
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold mb-6">Mes Rendez-vous</h1>
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-4xl mx-auto">
            <div id="calendar">
                <div class="flex justify-between items-center mb-4">
                    <button id="prev-month" class="text-gray-700"><</button>
                    <span id="month-year" class="text-lg font-bold"></span>
                    <button id="next-month" class="text-gray-700">></button>
                </div>
                <div class="grid grid-cols-7">
                    <p class="text-charcoal/80 dark:text-white/80 text-[13px] font-bold leading-normal tracking-[0.015em] flex h-12 w-full items-center justify-center pb-0.5">D</p>
                    <p class="text-charcoal/80 dark:text-white/80 text-[13px] font-bold leading-normal tracking-[0.015em] flex h-12 w-full items-center justify-center pb-0.5">L</p>
                    <p class="text-charcoal/80 dark:text-white/80 text-[13px] font-bold leading-normal tracking-[0.015em] flex h-12 w-full items-center justify-center pb-0.5">M</p>
                    <p class="text-charcoal/80 dark:text-white/80 text-[13px] font-bold leading-normal tracking-[0.015em] flex h-12 w-full items-center justify-center pb-0.5">M</p>
                    <p class="text-charcoal/80 dark:text-white/80 text-[13px] font-bold leading-normal tracking-[0.015em] flex h-12 w-full items-center justify-center pb-0.5">J</p>
                    <p class="text-charcoal/80 dark:text-white/80 text-[13px] font-bold leading-normal tracking-[0.015em] flex h-12 w-full items-center justify-center pb-0.5">V</p>
                    <p class="text-charcoal/80 dark:text-white/80 text-[13px] font-bold leading-normal tracking-[0.015em] flex h-12 w-full items-center justify-center pb-0.5">S</p>
                </div>
                <div id="calendar-days" class="col-span-7 grid grid-cols-7">
                    <!-- Days will be generated by JavaScript -->
                </div>
            </div>
        </div>
        <div id="appointment-details" class="mt-8 bg-white p-4 rounded-lg shadow-md hidden">
            <h2 class="text-xl font-bold mb-4">Rendez-vous le <span id="selected-date"></span></h2>
            <div id="appointments-list"></div>
        </div>
        <div class="mt-8 bg-white p-8 rounded-lg shadow-md w-full max-w-4xl mx-auto">
            <h2 class="text-2xl font-bold mb-6">Ajouter un Nouveau Rendez-vous</h2>
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 p-4 rounded {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="user_name" class="block text-gray-700 text-sm font-bold mb-2">Nom du Patient:</label>
                        <input type="text" id="user_name" name="user_name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div>
                        <label for="user_email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                        <input type="email" id="user_email" name="user_email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div>
                        <label for="user_phone" class="block text-gray-700 text-sm font-bold mb-2">Téléphone:</label>
                        <input type="text" id="user_phone" name="user_phone" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div>
                        <label for="appointment_date" class="block text-gray-700 text-sm font-bold mb-2">Date:</label>
                        <input type="date" id="appointment_date" name="appointment_date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                    </div>
                    <div>
                        <label for="appointment_time" class="block text-gray-700 text-sm font-bold mb-2">Heure:</label>
                        <input type="hidden" name="appointment_time" id="id_appointment_time">
                        <div id="time-slots" class="flex gap-3 p-3 flex-wrap pr-4">
                            <!-- Time slots will be generated by JavaScript -->
                        </div>
                    </div>
                    <div>
                        <label for="appointment_type" class="block text-gray-700 text-sm font-bold mb-2">Type de rendez-vous:</label>
                        <select id="appointment_type" name="appointment_type" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                            <option value="Visite">Visite</option>
                            <option value="MAPA">MAPA</option>
                        </select>
                    </div>
                    <div>
                        <label for="status" class="block text-gray-700 text-sm font-bold mb-2">Statut:</label>
                        <select id="status" name="status" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                            <option value="booked">Réservé</option>
                            <option value="confirmed">Confirmé</option>
                            <option value="cancelled">Annulé</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center justify-between mt-6">
                    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                        Ajouter Rendez-vous
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let appointments = {{ appointments_json|safe }};
        let appointmentDates = {};

        // Process appointments
        appointments.forEach(app => {
            let dateStr = app.appointment_date;
            if (!appointmentDates[dateStr]) {
                appointmentDates[dateStr] = [];
            }
            appointmentDates[dateStr].push(app);
        });

        function renderCalendar() {
            const monthYear = document.getElementById('month-year');
            monthYear.textContent = currentDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);

            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());

            const endDate = new Date(lastDay);
            endDate.setDate(endDate.getDate() + (6 - lastDay.getDay()));

            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'flex h-12 w-full items-center justify-center pb-0.5 text-[13px] cursor-pointer hover:bg-gray-200';
                if (d.getMonth() !== currentDate.getMonth()) {
                    dayDiv.classList.add('text-gray-400');
                }
                let dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                if (appointmentDates[dateStr]) {
                    dayDiv.style.backgroundColor = '#226a62';
                    dayDiv.style.color = 'white';
                }
                dayDiv.textContent = d.getDate();
                dayDiv.addEventListener('click', () => {
                    showAppointmentsForDate(dateStr);
                });
                daysContainer.appendChild(dayDiv);
            }
        }

        function showAppointmentsForDate(dateStr) {
            const detailsDiv = document.getElementById('appointment-details');
            const selectedDateSpan = document.getElementById('selected-date');
            const appointmentsListDiv = document.getElementById('appointments-list');

            selectedDateSpan.textContent = new Date(dateStr).toLocaleDateString('fr-FR');
            appointmentsListDiv.innerHTML = '';

            if (appointmentDates[dateStr]) {
                appointmentDates[dateStr].forEach(app => {
                    const appDiv = document.createElement('div');
                    appDiv.className = 'mb-2 p-2 border rounded';
                    appDiv.innerHTML = `
                        <p><strong>Patient:</strong> ${app.user_name}</p>
                        <p><strong>Email:</strong> ${app.user_email}</p>
                        <p><strong>Téléphone:</strong> ${app.user_phone}</p>
                        <p><strong>Heure:</strong> ${app.appointment_time}</p>
                        <p><strong>Type de rendez-vous:</strong> ${app.appointment_type}</p>
                        <p><strong>Statut:</strong> ${app.status}</p>
                    `;
                    appointmentsListDiv.appendChild(appDiv);
                });
            } else {
                appointmentsListDiv.innerHTML = '<p>Aucun rendez-vous à cette date.</p>';
            }

            detailsDiv.classList.remove('hidden');
        }

        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();

        // For add appointment form
        let selectedSlot = null;
        const doctorId = {{ doctor_id }};

        document.getElementById('appointment_date').addEventListener('change', updateSlots);

        function formatTime(timeStr) {
            const [h, m] = timeStr.split(':');
            const hour = parseInt(h);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const hour12 = hour % 12 || 12;
            return `${hour12}:${m} ${ampm}`;
        }

        function updateSlots() {
            const date = document.getElementById('appointment_date').value;
            const timeSlotsDiv = document.getElementById('time-slots');

            if (date) {
                fetch(`/api/available-slots/?doctor_id=${doctorId}&date=${date}`)
                    .then(response => response.json())
                    .then(data => {
                        timeSlotsDiv.innerHTML = '';
                        data.slots.forEach(slot => {
                            const slotDiv = document.createElement('div');
                            slotDiv.className = 'flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full pl-4 pr-4 cursor-pointer';
                            slotDiv.innerHTML = `<p class="text-sm font-medium leading-normal">${formatTime(slot)}</p>`;
                            const p = slotDiv.querySelector('p');
                            if (selectedSlot === slot) {
                                slotDiv.style.backgroundColor = '#226a62';
                                p.style.color = 'white';
                            } else {
                                slotDiv.style.backgroundColor = '#f1f4f3';
                                p.style.color = '#121616';
                            }
                            slotDiv.addEventListener('click', () => {
                                selectedSlot = slot;
                                document.getElementById('id_appointment_time').value = slot;
                                updateSlots(); // to re-render with selection
                            });
                            timeSlotsDiv.appendChild(slotDiv);
                        });
                    })
                    .catch(error => console.error('Error fetching slots:', error));
            } else {
                timeSlotsDiv.innerHTML = '';
            }
        }
    </script>
</body>
</html>
